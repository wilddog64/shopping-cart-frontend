version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # All npm major bumps deferred — each needs a dedicated migration (React 19,
      # Router 7, zustand 5, oidc-client-ts 3, etc.). Review and schedule each
      # manually. Minor/patch still flow (grouped in npm-minor-patch above).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react-refresh minor also deferred — 0.5.x requires eslint 9,
      # which is itself a deferred major; keep this until the eslint 9 migration.
      - dependency-name: "eslint-plugin-react-refresh"
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # node major deferred — stay on the current LTS line (22). Minor/patch and
      # non-node images (nginx) still flow.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Action major bumps deferred — review and schedule each manually.
      # Minor/patch (including security fixes) still flow.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
