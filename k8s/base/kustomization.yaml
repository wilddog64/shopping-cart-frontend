apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shopping-cart-apps

resources:
  - deployment.yaml
  - service.yaml

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: shopping-cart

images:
  - name: shopping-cart/frontend
    newName: ghcr.io/wilddog64/shopping-cart-frontend
    # CI rewrites this to sha-${{ github.sha }} on every push to main.
    newTag: sha-89ec11edab2c6d67b69ab6014acf5502225e9193
